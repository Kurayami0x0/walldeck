# walldeck configuration
#
# Copy to ~/.config/walldeck/config.conf and edit. Every key below is shown
# with its built-in default, so an empty file (or no file at all) behaves
# exactly like this one.
#
# Format: one `key = value` per line, `#` starts a comment. [section] headers
# are cosmetic grouping only — keys are global, so never repeat a key under a
# different section. A bad value warns on stderr and keeps that field's
# default; it never stops the program from starting.
#
# Paths support `~` and `$VAR` / `${VAR}`.


[paths]
wallpaper_dir  = ~/Pictures/Wallpapers
cache_dir      = $XDG_CACHE_HOME/walldeck

# Thumbnails are cover-cropped squares. Keep this >= icon_size or the picker
# will be upscaling them. Changing it regenerates the cache on next run.
thumbnail_size = 350

# Played once when the wallpaper changes, and once when a thumbnail build
# starts. A missing file or missing player is silently skipped — leave
# sound_file empty to disable the sound entirely.
sound_file     = /usr/share/sounds/freedesktop/stereo/complete.oga
sound_command  = pw-play

# Desktop notifications via notify-send.
notifications  = true


[wallpaper]
# The backend client binary. Anything with a `<command> img [flags] <path>`
# interface works. Distros that still package the pre-rename `swww` name, or
# forks, just need this pointed at the right binary.
command = awww

# Namespace for the primary target. Empty = the backend's default namespace.
namespace =

# Transition options. Every one of these is omitted from the command line
# when left empty, so blanks mean "use the backend's own default" rather than
# passing an empty flag. Values are passed through verbatim — run your
# backend's `img --help` for the authoritative list of what each accepts.
#
# awww transition types: simple, fade, left, right, top, bottom, wipe, grow,
# center, outer, any, random. `wipe`/`grow`/`outer` are the ones that use
# transition_angle / transition_pos.
transition_type     = center
transition_fps      = 60
transition_duration =
transition_step     =
transition_angle    =
transition_pos      =
transition_bezier   =
transition_wave     =
resize              =
fill_color          =
filter              =

# Anything not covered above, appended verbatim. Split on whitespace, with no
# quoting or escaping — arguments containing spaces aren't expressible here.
extra_args          =


[secondary]
# An optional second target: the same pick, applied to a different namespace
# using a differently-suffixed file. The usual case is a pre-blurred copy for
# an overview/exposé layer — `wall.jpg` picks up `wall-b.jpg`.
#
# Set secondary_enabled = false if you run a single daemon. Files ending in
# the suffix are also hidden from the picker itself, so the blurred copies
# don't show up as pickable wallpapers.
secondary_enabled   = true
secondary_namespace = overview
secondary_suffix    = -b

# false: a missing daemon or missing variant file is a warning, and walldeck
#        still exits successfully having applied the primary wallpaper.
# true:  either of those is a hard failure.
secondary_required  = false

# When a wallpaper has no matching '-b' file on disk, generate a blurred
# copy on the fly instead of leaving the secondary target unset. Generated
# copies are cached under cache_dir/blurred and regenerated only when the
# source changes -- same policy as the thumbnail cache. A real variant file,
# if you add one later, always takes priority over a generated one.
secondary_auto_blur  = false
secondary_blur_sigma = 20.0

# Same options as above, independently set for this target.
secondary_transition_type     =
secondary_transition_fps      = 60
secondary_transition_duration =
secondary_transition_step     =
secondary_transition_angle    =
secondary_transition_pos      =
secondary_transition_bezier   =
secondary_transition_wave     =
secondary_resize              =
secondary_fill_color          =
secondary_filter              =
secondary_extra_args          =


[layout]
window_width         = 1179
window_height        = 370   # icon panel height (thumbnails + padding)
icon_size            = 350
spacing              = 15    # gap between thumbnails
padding              = 10    # inset from the panel edge
corner_radius        = 12    # per-thumbnail rounding
window_corner_radius = 20    # icon panel rounding

# The search bar is its own pill below the panel, sized independently of it.
search_bar_height        = 44
search_bar_width         = 300
search_bar_gap           = 16  # vertical gap between panel and pill
search_bar_corner_radius = 22  # half the height = a full pill


[colors]
# "#rrggbb" or "#rrggbbaa". The alpha channel is real translucency — the
# compositor blurs/blends behind it if it's set up to.
background            = "#1e1e2eeb"
search_bar_background = "#181825eb"
search_text_color     = "#cdd6f4"
highlight_border      = "#f9e2af"
highlight_border_width = 3

# 0-255, the alpha non-selected thumbnails are drawn at, so the selected one
# stands out without needing a heavier border. 255 disables the dimming.
dim_opacity            = 190


[animation]
open_duration_ms      = 200
close_duration_ms     = 160

# The panel scales up from this fraction of full size while opening (and back
# down while closing) — a subtle pop rather than a flat fade. 1.0 = no scale.
open_close_scale_from = 0.92

# Cubic-bezier control points, same convention as CSS cubic-bezier().
open_close_curve      = 0.42, 0.0, 0.58, 1.0

# How fast the rendered position chases the logical target, per second.
# Higher is snappier, lower is floatier.
scroll_smoothing      = 14.0
highlight_smoothing   = 20.0

# Touchpad/wheel momentum decay after your fingers leave the pad.
momentum_half_life_ms = 120.0

# Pixels per discrete mouse-wheel click. Touchpads use their own reported
# deltas and ignore this.
wheel_step            = 60
